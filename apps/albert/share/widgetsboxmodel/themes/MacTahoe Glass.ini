;
; MacTahoe Glass Theme for Albert
; Translucent blurred acrylic glass style for macOS Tahoe
;

tahoe_glass_bg=#99202022
tahoe_glass_card=#402c2c2e
tahoe_glass_border=#33ffffff
tahoe_glass_fg=#f5f5f7
tahoe_glass_fg_secondary=#a1a1a6
tahoe_glass_fg_muted=#7c7c82
tahoe_glass_blue=#0a84ff
tahoe_glass_blue_dark=#0071e3
tahoe_glass_selection=#e60a84ff
tahoe_glass_selection_fg=#ffffff
tahoe_glass_selection_subtext=#d8e9ff
tahoe_glass_shadow=#66000000

[palette]
base=$tahoe_glass_card
text=$tahoe_glass_fg

window=$tahoe_glass_bg
window_text=$tahoe_glass_fg

button=$tahoe_glass_card
button_text=$tahoe_glass_fg

highlight=$tahoe_glass_blue
highlight_text=$tahoe_glass_selection_fg

placeholder_text=$tahoe_glass_fg_muted

link=$tahoe_glass_blue
link_visited=$tahoe_glass_blue_dark

[window]
window_shadow_brush=$tahoe_glass_shadow
window_background_brush=$tahoe_glass_bg
window_border_brush=$tahoe_glass_border
input_background_brush=transparent
input_border_brush=transparent
input_trigger_color=$tahoe_glass_blue
input_hint_color=$tahoe_glass_fg_muted
settings_button_color=$tahoe_glass_fg_secondary
settings_button_highlight_color=$tahoe_glass_blue
result_item_selection_background_brush=$tahoe_glass_selection
result_item_selection_border_brush=transparent
result_item_selection_text_color=$tahoe_glass_selection_fg
result_item_selection_subtext_color=$tahoe_glass_selection_subtext
result_item_text_color=$tahoe_glass_fg
result_item_subtext_color=$tahoe_glass_fg_secondary
action_item_selection_background_brush=$tahoe_glass_selection
action_item_selection_border_brush=transparent
action_item_selection_text_color=$tahoe_glass_selection_fg
action_item_text_color=$tahoe_glass_fg
