;
; MacTahoe Dark Theme for Albert
; Designed for macOS Tahoe style aesthetic
;

tahoe_bg=#b81e1e20
tahoe_card=#30ffffff
tahoe_border=#3d3d41
tahoe_fg=#f5f5f7
tahoe_fg_secondary=#98989d
tahoe_fg_muted=#636366
tahoe_blue=#0a84ff
tahoe_blue_dark=#0071e3
tahoe_selection=#0a84ff
tahoe_selection_fg=#ffffff
tahoe_selection_subtext=#d8e9ff
tahoe_shadow=#80000000

[palette]
base=$tahoe_card
text=$tahoe_fg

window=$tahoe_bg
window_text=$tahoe_fg

button=$tahoe_card
button_text=$tahoe_fg

highlight=$tahoe_blue
highlight_text=$tahoe_selection_fg

placeholder_text=$tahoe_fg_muted

link=$tahoe_blue
link_visited=$tahoe_blue_dark

[window]
window_shadow_brush=$tahoe_shadow
window_background_brush=$tahoe_bg
window_border_brush=$tahoe_border
input_background_brush=transparent
input_border_brush=transparent
input_trigger_color=$tahoe_blue
input_hint_color=$tahoe_fg_muted
settings_button_color=$tahoe_fg_secondary
settings_button_highlight_color=$tahoe_blue
result_item_selection_background_brush=$tahoe_selection
result_item_selection_border_brush=transparent
result_item_selection_text_color=$tahoe_selection_fg
result_item_selection_subtext_color=$tahoe_selection_subtext
result_item_text_color=$tahoe_fg
result_item_subtext_color=$tahoe_fg_secondary
action_item_selection_background_brush=$tahoe_selection
action_item_selection_border_brush=transparent
action_item_selection_text_color=$tahoe_selection_fg
action_item_text_color=$tahoe_fg
