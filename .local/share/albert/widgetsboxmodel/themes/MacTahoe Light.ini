;
; MacTahoe Light Theme for Albert
; Designed for macOS Tahoe style aesthetic
;

tahoe_light_bg=#f5f5f7
tahoe_light_card=#ffffff
tahoe_light_border=#d2d2d7
tahoe_light_fg=#1d1d1f
tahoe_light_fg_secondary=#6e6e73
tahoe_light_fg_muted=#86868b
tahoe_light_blue=#0071e3
tahoe_light_blue_dark=#0056b3
tahoe_light_selection=#0071e3
tahoe_light_selection_fg=#ffffff
tahoe_light_selection_subtext=#e5f0ff
tahoe_light_shadow=#40000000

[palette]
base=$tahoe_light_card
text=$tahoe_light_fg

window=$tahoe_light_bg
window_text=$tahoe_light_fg

button=$tahoe_light_card
button_text=$tahoe_light_fg

highlight=$tahoe_light_blue
highlight_text=$tahoe_light_selection_fg

placeholder_text=$tahoe_light_fg_muted

link=$tahoe_light_blue
link_visited=$tahoe_light_blue_dark

[window]
window_shadow_brush=$tahoe_light_shadow
window_background_brush=$tahoe_light_bg
window_border_brush=$tahoe_light_border
input_background_brush=transparent
input_border_brush=transparent
input_trigger_color=$tahoe_light_blue
input_hint_color=$tahoe_light_fg_muted
settings_button_color=$tahoe_light_fg_secondary
settings_button_highlight_color=$tahoe_light_blue
result_item_selection_background_brush=$tahoe_light_selection
result_item_selection_border_brush=transparent
result_item_selection_text_color=$tahoe_light_selection_fg
result_item_selection_subtext_color=$tahoe_light_selection_subtext
result_item_text_color=$tahoe_light_fg
result_item_subtext_color=$tahoe_light_fg_secondary
action_item_selection_background_brush=$tahoe_light_selection
action_item_selection_border_brush=transparent
action_item_selection_text_color=$tahoe_light_selection_fg
action_item_text_color=$tahoe_light_fg
